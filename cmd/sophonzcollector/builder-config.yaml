dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/sophonzcollector
  name: sophonz-collector
  description: SOPHONZ custom OpenTelemetry Collector distribution.
  version: 0.165.1-sophonz
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.1-0.20261122191605-d56d0a1c98b6
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.165.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jaegerreceiver v0.165.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.165.1

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.165.1-0.20261122191605-d56d0a1c98b6
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.1-0.20261122191605-d56d0a1c98b6
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.165.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/sophonzattributeprocessor v0.0.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/sophonzconsoleprintprocessor v0.0.1

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/sophonzclickhousetracesexporter v0.0.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/sophonzclickhousemetricsexporter v0.0.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/sophonzclickhouselogsexporter v0.0.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/sophonzotlphttpexporter v0.0.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.159.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.165.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.165.1
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.165.1-0.20261122191605-d56d0a1c98b6
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.165.1

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.1-0.20261122191605-d56d0a1c98b6
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.1-0.20261122191605-d56d0a1c98b6

telemetry:
  gomod: go.opentelemetry.io/collector/service v0.165.1-0.20261122191605-d56d0a1c98b6
  import: go.opentelemetry.io/collector/service/telemetry/otelconftelemetry

